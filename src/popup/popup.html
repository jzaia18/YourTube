<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YourTube</title>
    <link rel="stylesheet" href="popup.css" />
    <!-- MV3's CSP forbids inline scripts; all JS must come from extension files. -->
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <h1>YourTube</h1>
    <label class="toggle" title="Turns every YourTube change on or off at once; off shows plain YouTube.">
      <input type="checkbox" id="enabled" data-setting="enabled" />
      Enabled
    </label>
    <p id="off-note" class="note" hidden>YourTube is off: changes will apply when you turn it back on.</p>

    <section title="Chooses the page that opens when you click the YouTube logo.">
      <label for="logo-destination">YouTube logo goes to</label>
      <select id="logo-destination"></select>
      <div id="logo-custom" hidden>
        <input
          type="text"
          id="logo-custom-path"
          title="Paste a YouTube link or type a page, like /feed/history, for the logo to open."
          placeholder="/feed/history"
          spellcheck="false"
          autocomplete="off"
          aria-describedby="logo-custom-error logo-custom-hint"
        />
        <p id="logo-custom-error" class="error" hidden></p>
        <p id="logo-custom-hint" class="note" hidden></p>
      </div>
    </section>

    <section>
      <h2>Ads and shopping</h2>
      <label class="toggle" title="Hides ads YouTube places beside, between, and above videos. Ads inside the player still play.">
        <input type="checkbox" data-setting="hidePageAds" />
        Hide ads around videos
      </label>
      <label class="toggle" title="Hides the shelf of products a channel sells, shown below some videos.">
        <input type="checkbox" data-setting="hideStoreShelf" />
        Hide channel stores below videos
      </label>
    </section>

    <section>
      <div class="section-header">
        <h2>Shorts</h2>
        <button type="button" class="select-all" title="Turns on every setting in this section, or turns them all off once they're all on."></button>
      </div>
      <label class="toggle" title="Hides Shorts from the homepage, leaving only regular videos.">
        <input type="checkbox" data-setting="hideShortsOnHomepage" />
        Hide on the homepage
      </label>
      <label class="toggle" title="Hides Shorts from the Subscriptions page, leaving only regular videos.">
        <input type="checkbox" data-setting="hideShortsInSubscriptions" />
        Hide in Subscriptions
      </label>
      <label class="toggle" title="Hides Shorts from search results, leaving only regular videos, channels, and playlists.">
        <input type="checkbox" data-setting="hideShortsInSearch" />
        Hide in search results
      </label>
    </section>

    <section>
      <label class="toggle" title="Hides YouTube's AI “Ask” button below videos and in the fullscreen player.">
        <input type="checkbox" data-setting="hideAskButton" />
        Hide the “Ask” button
      </label>
    </section>

    <section>
      <h2>Sidebar (Guide)</h2>
      <label class="toggle" title="Hides the sidebar (Guide) section of topic pages, like Music, Live, and Movies &amp; TV.">
        <input type="checkbox" data-setting="hideGuideExplore" />
        Hide “Explore”
      </label>
      <label class="toggle" title="Hides the sidebar (Guide) section of links to YouTube Premium, Music, Kids, and TV.">
        <input type="checkbox" data-setting="hideGuideMoreFromYouTube" />
        Hide “More from YouTube”
      </label>
    </section>
  </body>
</html>
