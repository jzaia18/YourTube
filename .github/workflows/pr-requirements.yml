name: Pull request requirements

# Sets the pull request's dev version in manifest.json (see .github/scripts/dev-version.js) and
# checks that .github/CHANGELOG.md links back to the pull request.
#
# Pushes made with GITHUB_TOKEN don't start new workflow runs, so after pushing a version update
# this job reports its result on the new commit as a status with the job's own name. Requiring
# "Version and changelog" in branch protection then works whether or not a push happened.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  requirements:
    name: Version and changelog
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set the dev version
        id: version
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:manifest.json > "$RUNNER_TEMP/main-manifest.json"
          node .github/scripts/dev-version.js "$RUNNER_TEMP/main-manifest.json" manifest.json

      - name: Push the version update
        id: push
        if: steps.version.outputs.changed == 'true' && env.SAME_REPO == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          # The public noreply address of GitHub's own github-actions[bot] account (user ID 41898282),
          # so the commit shows that account as its author. Not a secret.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] stops GitHub from queuing a run for this push that would wait for approval.
          git commit -am "[skip ci] Update version to $VERSION_NAME"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the version and changelog
        id: check
        env:
          RELEASE: ${{ steps.version.outputs.release }}
          CHANGED: ${{ steps.version.outputs.changed }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          ok=true
          if [[ "$CHANGED" == true && "$SAME_REPO" != true ]]; then
            echo "::error file=manifest.json::Pull requests from forks can't be updated automatically. Set \"version_name\" to \"$VERSION_NAME\" and \"version\" to match, as printed in the 'Set the dev version' step."
            ok=false
          fi
          if [[ "$RELEASE" != true ]] && ! grep -qF "[(#$PR_NUMBER)]($PR_URL)" .github/CHANGELOG.md; then
            echo "::error file=.github/CHANGELOG.md::Add an entry to .github/CHANGELOG.md that ends with a link to this pull request: [(#$PR_NUMBER)]($PR_URL)"
            ok=false
          fi
          [[ "$ok" == true ]]

      - name: Report the result on the updated commit
        if: always() && steps.push.outputs.sha
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.push.outputs.sha }}
          STATE: ${{ steps.check.outcome == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" \
            -f context="Version and changelog" \
            -f description="Changelog and version check: $STATE" \
            -f target_url="$RUN_URL"
